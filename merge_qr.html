<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>收款码合并 · 图层融合</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{wx:'#07C160',ali:'#1677FF',ink:'#2C2C2C'}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#f5f2ed;color:#3c3028;min-height:100vh;line-height:1.5}
  .card{background:#fffdf9;border:1px solid #e5d8c4;border-radius:14px;padding:20px;margin:0 auto 16px;max-width:600px;box-shadow:0 1px 8px rgba(0,0,0,.04)}
  .up-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .up-box{border:2px dashed #d4c5aa;border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fefcf8;position:relative}
  .up-box:hover{border-color:#b8955a;background:#fcf6ed}
  .up-box.done{border-style:solid;border-color:#07C160}
  .up-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
  .up-box .ph{text-align:center;pointer-events:none;z-index:1}
  .up-box .ph .ic{font-size:36px;margin-bottom:4px}
  .up-box .ph .lb{font-size:14px;font-weight:600}
  .up-box .ph .hi{font-size:12px;color:#9b8c7c;margin-top:2px}
  .up-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
  .btn{border:none;border-radius:10px;padding:12px 28px;font-size:15px;cursor:pointer;font-weight:600;transition:all .2s}
  .btn-p{background:#3c3028;color:#fff;width:100%}
  .btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.15)}
  .btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-o{background:#fff;color:#3c3028;border:1px solid #d4c5a9}
  .t{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#3c3028;color:#fff;padding:12px 28px;border-radius:20px;font-size:14px;font-weight:600;z-index:9999;display:none}
  .status{font-size:12px;margin-top:4px;text-align:center}
  .status.ok{color:#07C160}.status.err{color:#e05a5a}
  .hidden{display:none !important}
  @media(max-width:600px){.up-row{grid-template-columns:1fr}}
</style>
</head>
<body class="p-4 md:p-8">

<div>
  <h1 style="text-align:center;font-size:26px;font-weight:700;margin-bottom:4px">📱 收款码图层合并</h1>
  <p style="text-align:center;color:#9b8c7c;font-size:14px;margin-bottom:24px">上传 → 解析链接 → 高容错重编码 → 智能叠加</p>

  <div class="card">
    <h2 style="font-size:16px;font-weight:700;margin-bottom:14px">① 上传收款码</h2>
    <div class="up-row">
      <div>
        <div class="up-box" id="wxB">
          <input type="file" id="wxIn" accept="image/*" onchange="up('wx',this.files[0])">
          <div class="ph" id="wxPh"><div class="ic">💚</div><div class="lb">微信收款码</div><div class="hi">点击或拖拽上传</div></div>
          <img id="wxIm" style="display:none">
        </div>
        <div class="status" id="wxSt"></div>
        <button id="wxCl" style="display:none;margin:6px auto 0;font-size:12px;color:#e05a5a;background:none;border:none;cursor:pointer;width:100%;text-align:center" onclick="event.preventDefault();cl('wx')">✕ 清除</button>
      </div>
      <div>
        <div class="up-box" id="aliB">
          <input type="file" id="aliIn" accept="image/*" onchange="up('ali',this.files[0])">
          <div class="ph" id="aliPh"><div class="ic">💙</div><div class="lb">支付宝收款码</div><div class="hi">点击或拖拽上传</div></div>
          <img id="aliIm" style="display:none">
        </div>
        <div class="status" id="aliSt"></div>
        <button id="aliCl" style="display:none;margin:6px auto 0;font-size:12px;color:#e05a5a;background:none;border:none;cursor:pointer;width:100%;text-align:center" onclick="event.preventDefault();cl('ali')">✕ 清除</button>
      </div>
    </div>
  </div>

  <div class="card" style="text-align:center">
    <button class="btn btn-p" id="go" disabled onclick="go()">🔀 生成合并收款码</button>
    <p style="font-size:12px;color:#9b8c7c;margin-top:8px" id="goH">请先上传两个收款码</p>
  </div>

  <!-- Loading -->
  <div class="card hidden" id="loading" style="text-align:center">
    <p>⏳ 正在生成高容错二维码并合成...</p>
    <p style="font-size:12px;color:#9b8c7c">这可能需要几秒钟</p>
  </div>

  <!-- Result -->
  <div class="card hidden" id="res">
    <h2 style="font-size:16px;font-weight:700;margin-bottom:4px;text-align:center">✅ 生成结果</h2>
    <p style="text-align:center;font-size:12px;color:#9b8c7c;margin-bottom:12px">微信码为底层 · 支付宝处理后叠加右下角 · 纠错H级</p>
    <div style="text-align:center;margin-bottom:14px"><img id="out" style="max-width:100%;border-radius:12px;border:1px solid #e0d8c8;box-shadow:0 2px 12px rgba(0,0,0,.06)"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-p" style="flex:1" onclick="dl()">📥 下载 PNG</button>
      <button class="btn btn-o" style="flex:1" onclick="cp()">📋 复制</button>
    </div>
  </div>
</div>

<div class="t" id="toast"></div>

<script>
var st={wxData:null,wxUrl:null,aliData:null,aliUrl:null,result:null};

function T(m,d){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},d||2000);}

function up(prefix,file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    var url=e.target.result;
    st[prefix+'Data']=url;
    document.getElementById(prefix+'Im').src=url;document.getElementById(prefix+'Im').style.display='block';
    document.getElementById(prefix+'Ph').style.display='none';document.getElementById(prefix+'B').classList.add('done');
    document.getElementById(prefix+'Cl').style.display='block';
    T(prefix==='wx'?'✅ 微信码已上传，解析中...':'✅ 支付宝码已上传，解析中...',1500);
    decode(prefix,url);
  };
  r.onerror=function(){T('❌ 读取失败');};
  r.readAsDataURL(file);
}

function decode(prefix,dataUrl){
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');
    var s=Math.max(img.width,img.height);
    c.width=s;c.height=s;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,(s-img.width)/2,(s-img.height)/2);
    var d=ctx.getImageData(0,0,s,s);
    var code=jsQR(d.data,s,s);
    var el=document.getElementById(prefix+'St');
    if(code&&code.data){
      st[prefix+'Url']=code.data;
      el.textContent='✅ 解析成功: '+code.data.substring(0,40)+'...';
      el.className='status ok';
      T(prefix==='wx'?'✅ 微信链接已解析':'✅ 支付宝链接已解析',1500);
    }else{
      st[prefix+'Url']=null;
      el.textContent='⚠️ 未识别到二维码，请确认图片清晰';
      el.className='status err';
      T(prefix==='wx'?'⚠️ 微信码解析失败':'⚠️ 支付宝码解析失败',2000);
    }
    chk();
  };
  img.onerror=function(){T('❌ 图片加载失败');};
  img.src=dataUrl;
}

function cl(prefix){
  st[prefix+'Data']=null;st[prefix+'Url']=null;
  document.getElementById(prefix+'Im').style.display='none';
  document.getElementById(prefix+'Ph').style.display='';
  document.getElementById(prefix+'B').classList.remove('done');
  document.getElementById(prefix+'Cl').style.display='none';
  document.getElementById(prefix+'In').value='';
  document.getElementById(prefix+'St').textContent='';
  chk();
}

function chk(){
  var ok=!!(st.wxUrl&&st.aliUrl);
  document.getElementById('go').disabled=!ok;
  document.getElementById('goH').textContent=ok?'两个链接已解析 ✓':'请先上传两个收款码';
}

/* ---- Generate QR via API with H-level ECC ---- */
function genQR(url,cb){
  var api='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data='+encodeURIComponent(url)+'&ecc=H&margin=4';
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){cb(null,img);};
  img.onerror=function(){cb(new Error('QR API fail'));};
  img.src=api;
}

function go(){
  if(!st.wxUrl||!st.aliUrl)return T('请等待两个码都解析完成');
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('res').classList.add('hidden');

  var loaded=0,wxImg,aliImg;
  function done(){
    loaded++;if(loaded<2)return;
    document.getElementById('loading').classList.add('hidden');
    merge(wxImg,aliImg);
  }
  genQR(st.wxUrl,function(err,img){if(err)return T('❌ 微信码生成失败');wxImg=img;done();});
  genQR(st.aliUrl,function(err,img){if(err)return T('❌ 支付宝码生成失败');aliImg=img;done();});
}

function merge(wxImg,aliImg){
  // Base size from WeChat QR
  var baseW=wxImg.width,baseH=wxImg.height;
  var out=document.createElement('canvas');
  out.width=baseW;out.height=baseH;
  var ctx=out.getContext('2d');

  // 1. Draw WeChat QR as full background
  ctx.drawImage(wxImg,0,0,baseW,baseH);

  // 2. Process Alipay QR: load into temp canvas, erase finders, rotate 180°
  var tmp=document.createElement('canvas');
  tmp.width=aliImg.width;tmp.height=aliImg.height;
  var tctx=tmp.getContext('2d');
  tctx.drawImage(aliImg,0,0);

  // Erase the 3 finder patterns (corner squares, ~7 modules each)
  var modW=aliImg.width/37; // QR v3 = 29 modules + 8 quiet = 37
  var f=modW*8; // finder pattern ~7 modules + 1 margin
  tctx.fillStyle='#FFFFFF';
  tctx.fillRect(0,0,f,f); // top-left
  tctx.fillRect(aliImg.width-f,0,f,f); // top-right
  tctx.fillRect(0,aliImg.height-f,f,f); // bottom-left

  // 3. Overlay Alipay (rotated 180°) at bottom-right corner
  var scale=0.38;
  var ow=Math.floor(baseW*scale),oh=Math.floor(baseH*scale);
  var ox=baseW-ow-Math.floor(baseW*0.03);
  var oy=baseH-oh-Math.floor(baseH*0.03);

  ctx.save();
  ctx.translate(ox+ow/2,oy+oh/2);
  ctx.rotate(Math.PI);
  ctx.drawImage(tmp,-ow/2,-oh/2,ow,oh);
  ctx.restore();

  // 4. Label bar
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,baseH-28,baseW,28);
  ctx.fillStyle='#fff';ctx.font='bold 12px -apple-system,system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('微信 / 支付宝 二合一收款码',baseW/2,baseH-9);

  st.result=out.toDataURL('image/png');
  document.getElementById('out').src=st.result;
  document.getElementById('res').classList.remove('hidden');
  document.getElementById('res').scrollIntoView({behavior:'smooth'});
  T('✅ 生成完成，建议扫码测试');
}

function dl(){if(!st.result)return;var a=document.createElement('a');a.href=st.result;a.download='merged_qr.png';a.click();}
function cp(){
  if(!st.result)return;
  fetch(st.result).then(function(r){return r.blob()}).then(function(b){
    navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(function(){T('📋 已复制')}).catch(function(){dl();T('已自动下载')});
  });
}
</script>
</body>
</html>
