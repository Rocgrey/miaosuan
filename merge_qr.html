<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>收款码合并 · 嵌套二维码</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{wx:'#07C160',ali:'#1677FF',ink:'#2C2C2C',paper:'#FDF9F5'}}}}</script>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#f8f5f0,#f0ece6);min-height:100vh}
  .card{background:#FFFDF8;border:1px solid #E8DCC8;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.05)}
  .up-box{border:2px dashed #d4c5a9;border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:all .2s}
  .up-box:hover{border-color:#b8945a;background:#fdf8f0}
  .up-box.done{border-style:solid;border-color:#c8b88a}
  .up-box img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;padding:6px}
  .btn{border:none;border-radius:10px;padding:12px 28px;font-size:16px;cursor:pointer;font-weight:600;transition:all .2s}
  .btn-p{background:linear-gradient(135deg,#2C2C2C,#4A4A4A);color:#fff}
  .btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
  .tag-wx{background:#07C160;color:#fff;font-size:12px;padding:3px 10px;border-radius:10px}
  .tag-ali{background:#1677FF;color:#fff;font-size:12px;padding:3px 10px;border-radius:10px}
  .t{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2C2C2C;color:#fff;padding:12px 28px;border-radius:20px;font-size:15px;z-index:9999;font-weight:600;white-space:nowrap}
</style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

<div class="w-full max-w-lg">
  <h1 class="text-2xl md:text-3xl font-bold text-center text-ink mb-1">📱 收款码嵌套合并</h1>
  <p class="text-center text-gray-500 text-sm mb-8">内层支付宝码 + 外层微信码框架 = 一张图</p>

  <!-- Upload -->
  <div class="card p-5 mb-4">
    <h2 class="text-base font-semibold text-ink mb-4">① 上传收款码</h2>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="wxIn" class="up-box" id="wxB" style="cursor:pointer">
          <input type="file" id="wxIn" accept="image/*" onchange="up('wx',this.files[0])" style="width:0;height:0;position:absolute;opacity:0">
          <div id="wxH" class="text-center"><div class="text-3xl mb-1">💚</div><div class="text-sm text-gray-500">微信收款码</div><div class="text-xs text-gray-400">外层框架</div></div>
          <img id="wxM" style="display:none">
        </label>
        <button id="wxC" class="text-xs text-red-400 mt-1 hidden w-full" onclick="event.preventDefault();cl('wx')">✕ 清除</button>
      </div>
      <div>
        <label for="aliIn" class="up-box" id="aliB" style="cursor:pointer">
          <input type="file" id="aliIn" accept="image/*" onchange="up('ali',this.files[0])" style="width:0;height:0;position:absolute;opacity:0">
          <div id="aliH" class="text-center"><div class="text-3xl mb-1">💙</div><div class="text-sm text-gray-500">支付宝收款码</div><div class="text-xs text-gray-400">内层核心</div></div>
          <img id="aliM" style="display:none">
        </label>
        <button id="aliC" class="text-xs text-red-400 mt-1 hidden w-full" onclick="event.preventDefault();cl('ali')">✕ 清除</button>
      </div>
    </div>
  </div>

  <!-- Generate -->
  <div class="card p-5 mb-4 text-center">
    <button id="go" class="btn btn-p" disabled onclick="gen()">🔀 生成合并码</button>
    <p id="goHint" class="text-xs text-gray-400 mt-2">请先上传两个收款码</p>
  </div>

  <!-- Result -->
  <div id="res" class="card p-5 hidden">
    <h2 class="text-base font-semibold text-ink mb-1 text-center">✅ 合并结果</h2>
    <p class="text-center text-xs text-gray-500 mb-4">
      <span class="tag-wx">微信扫外层</span> &nbsp; <span class="tag-ali">支付宝扫内层</span>
    </p>
    <div class="flex justify-center mb-4"><img id="out" class="max-w-full rounded-xl border border-gray-200 shadow-sm"></div>
    <div class="flex gap-3">
      <button class="btn btn-p flex-1 text-sm" onclick="dl()">📥 下载</button>
      <button class="btn flex-1 text-sm" style="background:#e8e0d0;color:#5D4E37" onclick="cp()">📋 复制</button>
    </div>
    <div class="mt-4 p-4 bg-amber-50 rounded-lg text-xs text-gray-700">
      <p class="font-medium mb-1">⚠️ 扫码说明</p>
      <p>微信码作为外层（全覆盖），支付宝码叠加在中心位置（180×180，带白边分隔）。扫描时请对准对应区域。是否能成功识别取决于原始二维码的纠错等级，建议使用<b>高清收款码</b>以获得最佳效果。</p>
    </div>
  </div>

  <!-- Preview of layout -->
  <div class="card p-5 mt-4">
    <h2 class="text-base font-semibold text-ink mb-3">📐 布局示意</h2>
    <div class="bg-gray-100 rounded-xl p-4 flex justify-center">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <rect x="5" y="5" width="190" height="190" rx="8" fill="#e8ffe8" stroke="#07C160" stroke-width="2" stroke-dasharray="6,3"/>
        <text x="100" y="22" text-anchor="middle" font-size="10" fill="#07C160" font-weight="bold">微信收款码 (外层框架)</text>
        <rect x="40" y="40" width="120" height="120" rx="8" fill="#D0F0D0" stroke="#07C160" stroke-width="1"/>
        <rect x="55" y="55" width="90" height="90" rx="6" fill="#e8f0ff" stroke="#1677FF" stroke-width="3"/>
        <text x="100" y="105" text-anchor="middle" font-size="11" fill="#1677FF" font-weight="bold">支付宝码</text>
        <text x="100" y="120" text-anchor="middle" font-size="9" fill="#1677FF">(内层)</text>
        <line x1="55" y1="135" x2="145" y2="135" stroke="#1677FF" stroke-width="1"/>
        <text x="100" y="195" text-anchor="middle" font-size="9" fill="#999">合并后效果示意</text>
      </svg>
    </div>
    <p class="text-xs text-gray-500 mt-3 text-center">微信码铺满全图，支付宝码居中叠加（约占 30%），白边分隔两个码</p>
  </div>
</div>

<div id="toast" class="t" style="display:none"></div>

<script>
var wxUrl=null,aliUrl=null,mergedUrl=null;

function showT(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.style.display='block';
  clearTimeout(t._tid);t._tid=setTimeout(function(){t.style.display='none'},2000);
}

function up(type,file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    var url=e.target.result;
    if(type==='wx'){
      wxUrl=url;
      document.getElementById('wxM').src=url;document.getElementById('wxM').style.display='block';
      document.getElementById('wxH').style.display='none';document.getElementById('wxB').classList.add('done');
      document.getElementById('wxC').classList.remove('hidden');
    }else{
      aliUrl=url;
      document.getElementById('aliM').src=url;document.getElementById('aliM').style.display='block';
      document.getElementById('aliH').style.display='none';document.getElementById('aliB').classList.add('done');
      document.getElementById('aliC').classList.remove('hidden');
    }
    showT(type==='wx'?'✅ 微信收款码已上传':'✅ 支付宝收款码已上传');
    chk();
  };
  r.onerror=function(){showT('❌ 上传失败，请重试');};
  r.readAsDataURL(file);
}

function cl(type){
  if(type==='wx'){
    wxUrl=null;
    document.getElementById('wxM').style.display='none';document.getElementById('wxH').style.display='';
    document.getElementById('wxB').classList.remove('done');document.getElementById('wxC').classList.add('hidden');
    document.getElementById('wxIn').value='';
  }else{
    aliUrl=null;
    document.getElementById('aliM').style.display='none';document.getElementById('aliH').style.display='';
    document.getElementById('aliB').classList.remove('done');document.getElementById('aliC').classList.add('hidden');
    document.getElementById('aliIn').value='';
  }
  chk();
}

function chk(){
  var ok=wxUrl&&aliUrl;
  document.getElementById('go').disabled=!ok;
  document.getElementById('goHint').textContent=ok?'两个收款码已就绪 ✓':'请先上传两个收款码';
}

function gen(){
  if(!wxUrl||!aliUrl)return showT('请先上传两个收款码');
  showT('⏳ 正在生成...');

  var c=document.createElement('canvas');
  var S=600; // canvas size
  c.width=S;c.height=S;
  var ctx=c.getContext('2d');

  // White background
  ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,S,S);

  var wxI=new Image(),aliI=new Image(),n=0;
  function draw(){
    n++;if(n<2)return;

    // Layer 1: WeChat QR code fills entire canvas (outer frame)
    ctx.drawImage(wxI,0,0,S,S);

    // Layer 2: Alipay QR code centered, with white border
    var aliS=180; // Alipay QR size
    var aliX=(S-aliS)/2,aliY=(S-aliS)/2;
    var pad=6; // white padding around Alipay QR

    // White border
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(aliX-pad,aliY-pad,aliS+pad*2,aliS+pad*2);
    // Subtle shadow/border
    ctx.strokeStyle='#1677FF';
    ctx.lineWidth=3;
    ctx.strokeRect(aliX-pad,aliY-pad,aliS+pad*2,aliS+pad*2);

    // Alipay QR code
    ctx.drawImage(aliI,aliX,aliY,aliS,aliS);

    // Labels at bottom
    ctx.fillStyle='#999';
    ctx.font='12px -apple-system,system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('微信扫外层 ｜ 支付宝扫内层',S/2,S-10);

    mergedUrl=c.toDataURL('image/png');
    document.getElementById('out').src=mergedUrl;
    document.getElementById('res').classList.remove('hidden');
    document.getElementById('res').scrollIntoView({behavior:'smooth'});
    showT('✅ 合并完成');
  }
  wxI.onload=draw;wxI.onerror=function(){showT('❌ 微信码加载失败');};
  aliI.onload=draw;aliI.onerror=function(){showT('❌ 支付宝码加载失败');};
  wxI.src=wxUrl;aliI.src=aliUrl;
}

function dl(){
  if(!mergedUrl)return;
  var a=document.createElement('a');a.href=mergedUrl;a.download='merged_qr.png';a.click();
}
function cp(){
  if(!mergedUrl)return;
  fetch(mergedUrl).then(function(r){return r.blob()}).then(function(b){
    navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(function(){showT('📋 已复制到剪贴板')}).catch(function(){showT('复制失败，请用下载按钮')});
  });
}
</script>
</body>
</html>
