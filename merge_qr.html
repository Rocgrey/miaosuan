<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>收款码合并</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{wx:'#07C160',ali:'#1677FF',ink:'#2C2C2C'}}}}</script>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#f8f5f0,#f0ece6);min-height:100vh}
  .card{background:#FFFDF8;border:1px solid #E8DCC8;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.05)}
  .up-box{border:2px dashed #d4c5a9;border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
  .up-box:hover{border-color:#b8945a;background:#fdf8f0}
  .up-box img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;padding:6px}
  .btn{border:none;border-radius:10px;padding:12px 28px;font-size:16px;cursor:pointer;font-weight:600;transition:all .2s}
  .btn-p{background:linear-gradient(135deg,#2C2C2C,#4A4A4A);color:#fff}
  .btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
  .t{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2C2C2C;color:#fff;padding:12px 28px;border-radius:20px;font-size:15px;z-index:9999;font-weight:600;white-space:nowrap}
</style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

<div class="w-full max-w-lg">
  <h1 class="text-2xl md:text-3xl font-bold text-center text-ink mb-1">📱 收款码合并</h1>
  <p class="text-center text-gray-500 text-sm mb-8">微信 + 支付宝 → 一张图，各自独立可扫</p>

  <!-- Upload -->
  <div class="card p-5 mb-4">
    <h2 class="text-base font-semibold text-ink mb-4">① 上传收款码</h2>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="wxIn" class="up-box" id="wxB">
          <input type="file" id="wxIn" accept="image/*" onchange="up('wx',this.files[0])" style="width:0;height:0;position:absolute;opacity:0">
          <div id="wxH" class="text-center"><div class="text-3xl mb-1">💚</div><div class="text-sm text-gray-500">微信收款码</div></div>
          <img id="wxM" style="display:none">
        </label>
        <button id="wxC" class="text-xs text-red-400 mt-1 hidden w-full" onclick="event.preventDefault();cl('wx')">✕</button>
      </div>
      <div>
        <label for="aliIn" class="up-box" id="aliB">
          <input type="file" id="aliIn" accept="image/*" onchange="up('ali',this.files[0])" style="width:0;height:0;position:absolute;opacity:0">
          <div id="aliH" class="text-center"><div class="text-3xl mb-1">💙</div><div class="text-sm text-gray-500">支付宝收款码</div></div>
          <img id="aliM" style="display:none">
        </label>
        <button id="aliC" class="text-xs text-red-400 mt-1 hidden w-full" onclick="event.preventDefault();cl('ali')">✕</button>
      </div>
    </div>
  </div>

  <!-- Generate -->
  <div class="card p-5 mb-4 text-center">
    <button id="go" class="btn btn-p" disabled onclick="gen()">🔀 合并生成</button>
    <p id="hint" class="text-xs text-gray-400 mt-2">请先上传两个收款码</p>
  </div>

  <!-- Result -->
  <div id="res" class="card p-5 hidden">
    <h2 class="text-base font-semibold text-ink mb-1 text-center">✅ 合并结果</h2>
    <p class="text-center text-xs text-gray-500 mb-4">两个码独立可扫，分别对准各自二维码即可</p>
    <div class="flex justify-center mb-4"><img id="out" class="max-w-full rounded-xl border border-gray-200 shadow-sm"></div>
    <div class="flex gap-3">
      <button class="btn btn-p flex-1 text-sm" onclick="dl()">📥 下载</button>
      <button class="btn flex-1 text-sm" style="background:#e8e0d0;color:#5D4E37" onclick="cp()">📋 复制</button>
    </div>
  </div>
</div>

<div id="toast" class="t" style="display:none"></div>

<script>
var wxUrl=null,aliUrl=null,mergedUrl=null;

function T(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},2000);}

function up(type,file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    var url=e.target.result;
    if(type==='wx'){
      wxUrl=url;
      document.getElementById('wxM').src=url;document.getElementById('wxM').style.display='block';
      document.getElementById('wxH').style.display='none';
      document.getElementById('wxC').classList.remove('hidden');
    }else{
      aliUrl=url;
      document.getElementById('aliM').src=url;document.getElementById('aliM').style.display='block';
      document.getElementById('aliH').style.display='none';
      document.getElementById('aliC').classList.remove('hidden');
    }
    T(type==='wx'?'✅ 微信收款码已上传':'✅ 支付宝收款码已上传');
    document.getElementById('go').disabled=!(wxUrl&&aliUrl);
    document.getElementById('hint').textContent=(wxUrl&&aliUrl)?'两个收款码已就绪 ✓':'请先上传两个收款码';
  };
  r.onerror=function(){T('❌ 读取失败');};
  r.readAsDataURL(file);
}

function cl(type){
  if(type==='wx'){
    wxUrl=null;document.getElementById('wxM').style.display='none';document.getElementById('wxH').style.display='';
    document.getElementById('wxC').classList.add('hidden');document.getElementById('wxIn').value='';
  }else{
    aliUrl=null;document.getElementById('aliM').style.display='none';document.getElementById('aliH').style.display='';
    document.getElementById('aliC').classList.add('hidden');document.getElementById('aliIn').value='';
  }
  document.getElementById('go').disabled=!(wxUrl&&aliUrl);
  document.getElementById('hint').textContent=(wxUrl&&aliUrl)?'两个收款码已就绪 ✓':'请先上传两个收款码';
}

function gen(){
  if(!wxUrl||!aliUrl)return T('请先上传两个收款码');

  var c=document.createElement('canvas');
  var W=600,H=860;
  c.width=W;c.height=H;
  var ctx=c.getContext('2d');

  // Background
  ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);

  // Top decorative bar
  ctx.fillStyle='#2C2C2C';ctx.fillRect(0,0,W,50);
  ctx.fillStyle='#FFFFFF';ctx.font='bold 18px -apple-system,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('📱 扫一扫付款',W/2,34);

  var wxImg=new Image(),aliImg=new Image(),n=0;
  function draw(){
    n++;if(n<2)return;

    // --- WeChat section (top half) ---
    var wxY=70;
    ctx.fillStyle='#F0FDF4';roundRect(ctx,20,wxY,W-40,350,16);ctx.fill();
    ctx.strokeStyle='#07C160';ctx.lineWidth=2;roundRect(ctx,20,wxY,W-40,350,16);ctx.stroke();

    ctx.fillStyle='#07C160';ctx.font='bold 20px -apple-system,system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('微信扫码支付',W/2,wxY+35);

    var wxS=280,wxX=(W-wxS)/2,wxQY=wxY+50;
    ctx.fillStyle='#FFFFFF';ctx.fillRect(wxX-4,wxQY-4,wxS+8,wxS+8);
    ctx.drawImage(wxImg,wxX,wxQY,wxS,wxS);

    // --- Divider ---
    var divY=wxY+350+10;
    ctx.fillStyle='#E8DCC8';ctx.fillRect(40,divY,W-80,1);
    ctx.fillStyle='#FFFFFF';ctx.fillRect(W/2-30,divY-14,60,28);
    ctx.fillStyle='#999';ctx.font='13px -apple-system,system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('或',W/2,divY+5);

    // --- Alipay section (bottom half) ---
    var aliY=divY+30;
    ctx.fillStyle='#F0F7FF';roundRect(ctx,20,aliY,W-40,350,16);ctx.fill();
    ctx.strokeStyle='#1677FF';ctx.lineWidth=2;roundRect(ctx,20,aliY,W-40,350,16);ctx.stroke();

    ctx.fillStyle='#1677FF';ctx.font='bold 20px -apple-system,system-ui,sans-serif';
    ctx.fillText('支付宝扫码支付',W/2,aliY+35);

    var aliS=280,aliX=(W-aliS)/2,aliQY=aliY+50;
    ctx.fillStyle='#FFFFFF';ctx.fillRect(aliX-4,aliQY-4,aliS+8,aliS+8);
    ctx.drawImage(aliImg,aliX,aliQY,aliS,aliS);

    // Footer
    ctx.fillStyle='#999';ctx.font='12px -apple-system,system-ui,sans-serif';
    ctx.fillText('请使用对应App扫一扫付款 · 两个二维码均独立可扫',W/2,H-15);

    mergedUrl=c.toDataURL('image/png');
    document.getElementById('out').src=mergedUrl;
    document.getElementById('res').classList.remove('hidden');
    document.getElementById('res').scrollIntoView({behavior:'smooth'});
    T('✅ 合并完成');
  }
  wxImg.onload=draw;aliImg.onload=draw;
  wxImg.onerror=function(){T('❌ 微信码加载失败');};
  aliImg.onerror=function(){T('❌ 支付宝码加载失败');};
  wxImg.src=wxUrl;aliImg.src=aliUrl;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function dl(){
  if(!mergedUrl)return;var a=document.createElement('a');a.href=mergedUrl;a.download='pay_qr.png';a.click();
}
function cp(){
  if(!mergedUrl)return;
  fetch(mergedUrl).then(function(r){return r.blob()}).then(function(b){
    navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(function(){T('📋 已复制')}).catch(function(){dl();T('已自动下载');});
  });
}
</script>
</body>
</html>
